<article class="medicine-card card mb-3">
    <div class="card-body d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <div>
            <p class="eyebrow mb-1">Препарат №{{ medicine.id }}</p>
            <h2 class="h5 card-title mb-1">{{ medicine.name|default:"Без названия" }}</h2>
            <p class="card-text text-muted mb-0">Дозировка: {{ medicine.dosage }} {{ medicine.unit }}</p>
        </div>
        <a class="btn btn-outline-primary flex-shrink-0" href="{{ medicine.get_absolute_url }}">Подробнее</a>
    </div>
</article>
