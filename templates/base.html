{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Учёт лекарств, расписаний и истории приёма.">
    <title>{% block title %}Мой приём{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container py-3 d-flex align-items-center gap-3 flex-wrap">
            <a class="brand-link" href="{% url 'homepage:index' %}">
                <img
                    src="{% static 'homepage/img/logo.svg' %}"
                    alt="Логотип проекта «Мой приём»"
                    class="site-logo"
                >
            </a>
            <div>
                <p class="eyebrow mb-1">Персональный помощник</p>
                <p class="h4 mb-0">Мой приём</p>
            </div>
        </div>
        {% include "includes/navigation.html" %}
    </header>

    <main class="container py-4 py-lg-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer mt-auto">
        <div class="container py-3 d-flex justify-content-between flex-wrap gap-2">
            <span>© <span id="current-year"></span> Мой приём</span>
            <span class="text-muted">Данные хранятся в JSON</span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
